<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Exercicio 5</title>

    <link rel="stylesheet" href="../exercicio.css">
  </head>
  <body>
    <input type="number" id="celsiusInput" placeholder="Valor Celsius..." />
    <button onclick="converter()">Converter</button>

    <p id="resultadoConversao">Resultado:</p>

    <script>
      function converter() {
        const celsius = parseFloat(
          document.getElementById("celsiusInput").value,
        );
        if (!isNaN(celsius)) {
          const fahrenheit = (celsius * 9) / 5 + 32;
          document.getElementById("resultadoConversao").innerText =
            "Resultado: " + fahrenheit + " F";
        }
      }
    </script>
  </body>
</html>
